<script>
'use strict';
const data=JSON.parse(document.getElementById('figure-data').textContent);
const svg=document.querySelector('svg'),tip=document.getElementById('tooltip');
const groups=data.words.map((w,i)=>['A','B','C'].map(panel=>{
 const node=document.getElementById(`word-${i}-${panel}`);
 node.classList.add('word',panel==='C'?'scatter':'trajectory');return node;
}));
// A separate foreground layer preserves marker area while making selection unmistakable.
const selectionOverlay=document.createElementNS('http://www.w3.org/2000/svg','g');
selectionOverlay.id='active-scatter-overlay';
selectionOverlay.setAttribute('pointer-events','none');
svg.appendChild(selectionOverlay);
function emphasizeScatter(index){
 selectionOverlay.replaceChildren();
 const source=groups[index][2].querySelector('use');
 const reference=source.getAttribute('href')||source.getAttribute('xlink:href');
 const geometry=document.getElementById(reference.slice(1));
 selectionOverlay.setAttribute('clip-path',source.parentElement.getAttribute('clip-path'));
 for(const [fill,stroke,width] of [['none','#ffffff','4.0'],[data.words[index].color,'#222222','1.6']]){
  const marker=geometry.cloneNode(true);marker.removeAttribute('id');
  marker.setAttribute('transform',`translate(${source.getAttribute('x')} ${source.getAttribute('y')})`);
  marker.setAttribute('style',`fill:${fill};fill-opacity:1;stroke:${stroke};stroke-opacity:1;stroke-width:${width};stroke-linejoin:round`);
  selectionOverlay.appendChild(marker);
 }
}
let active=-1;
function restore(){if(active!==-1)groups.flat().forEach(g=>g.classList.remove('dimmed','selected'));selectionOverlay.replaceChildren();active=-1;tip.style.display='none';}
function segmentDistance(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];
 const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));
 return [Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy),t];}
function highlight(index,panel,checkpoint,event){
 if(active!==index){groups.forEach((row,i)=>row.forEach(g=>{g.classList.toggle('selected',i===index);g.classList.toggle('dimmed',i!==index);}));emphasizeScatter(index);active=index;}
 const word=data.words[index],value=panel==='C'?word.effect:word.alignment[checkpoint];
 tip.replaceChildren();
 const rows=[['Noun',word.noun],['Classifier',word.classifier],['Mean alignment',value.toFixed(2)],['P(classifier|noun)',word.probability.toFixed(2)]];
 for(const [label,value] of rows){const row=document.createElement('div'),key=document.createElement('b');key.textContent=label+': ';row.append(key,document.createTextNode(value));tip.append(row);}
 tip.style.borderColor=word.color;tip.style.color=word.color;tip.style.display='block';
 tip.style.left=Math.max(4,Math.min(event.clientX+16,innerWidth-tip.offsetWidth-8))+'px';
 tip.style.top=Math.max(4,Math.min(event.clientY+14,innerHeight-tip.offsetHeight-8))+'px';
}
svg.addEventListener('pointermove',event=>{
 const matrix=svg.getScreenCTM();if(!matrix)return;
 const p=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse());
 const xy=[p.x,p.y],scale=Math.hypot(matrix.a,matrix.b);
 const panel=Object.keys(data.panels).find(key=>{const [x,y,w,h]=data.panels[key];return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;});
 if(!panel){restore();return;}
 let best=Infinity,selected=-1,checkpoint=0;
 data.words.forEach((word,i)=>{
  if(panel==='C'){const distance=Math.hypot(p.x-word.C[0],p.y-word.C[1]);
   if(distance<=word.radius+4/scale&&distance<best){best=distance;selected=i;}}
  else for(let j=0;j<word[panel].length-1;j++){
   const [distance,t]=segmentDistance(xy,word[panel][j],word[panel][j+1]);
   if(distance<=6/scale&&distance<best){best=distance;selected=i;checkpoint=j+(t>=.5?1:0);}
  }
 });
 if(selected<0){restore();return;}highlight(selected,panel,checkpoint,event);
});
svg.addEventListener('pointerleave',restore);window.addEventListener('blur',restore);
